name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked

  boot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: xorriso mingw-w64-ucrt-x86_64-qemu
      - run: python tools/boot.py --run
